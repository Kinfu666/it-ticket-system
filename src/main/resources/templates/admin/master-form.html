<!DOCTYPE html>
<html
    lang="zh-Hant"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:replace="~{fragments/header :: head('資料設定')}"></head>
    <body>
        <th:block th:if="${actor != null}">
            <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
        </th:block>
        <div
            class="workspace"
            th:classappend="${actor==null}?'guest'"
        >
            <th:block th:if="${actor != null}">
                <header th:replace="~{fragments/header :: header}"></header>
            </th:block>
            <main class="page-content">
                <h1 th:text="${(id==null?'新增':'修改')+label}"></h1>
                <form
                    th:action="@{${action}}"
                    th:object="${form}"
                    method="post"
                >
                    <div
                        th:if="${#fields.hasAnyErrors()}"
                        role="alert"
                    >
                        <p
                            th:each="e:${#fields.allErrors()}"
                            th:text="${e}"
                        ></p>
                    </div>
                    <label>名稱
                        <input
                            th:field="*{name}"
                            required
                            maxlength="100"
                        >
                    </label>
                    <label th:if="${kind=='categories'}">說明
                        <textarea
                            th:field="*{description}"
                            maxlength="2000"
                        ></textarea>
                    </label>
                    <label>
                        <input
                            type="checkbox"
                            th:field="*{enabled}"
                        >啟用
                    </label>
                    <button>儲存</button>
                </form>
                <a th:href="@{/admin/{kind}(kind=${kind})}">返回列表</a>
            </main>
            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </body>
</html>
