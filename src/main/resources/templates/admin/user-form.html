<!DOCTYPE html>
<html
    lang="zh-Hant"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:replace="~{fragments/header :: head('帳號設定')}"></head>
    <body>
        <th:block th:if="${actor != null}">
            <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
        </th:block>
        <div
            class="workspace"
            th:classappend="${actor==null}?'guest'"
        >
            <th:block th:if="${actor != null}">
                <header th:replace="~{fragments/header :: header}"></header>
            </th:block>
            <main class="page-content">
                <h1 th:text="${id==null?'新增帳號':'修改帳號'}"></h1>
                <form
                    th:action="@{${action}}"
                    th:object="${form}"
                    method="post"
                >
                    <div
                        th:if="${#fields.hasAnyErrors()}"
                        role="alert"
                    >
                        <p
                            th:each="e:${#fields.allErrors()}"
                            th:text="${e}"
                        ></p>
                    </div>
                    <label>帳號
                        <input
                            th:field="*{username}"
                            required
                            minlength="3"
                            maxlength="50"
                            autocomplete="off"
                        >
                    </label>
                    <label>姓名
                        <input
                            th:field="*{fullName}"
                            required
                            maxlength="100"
                        >
                    </label>
                    <label>密碼
                        <input
                            type="password"
                            name="password"
                            autocomplete="new-password"
                        >
                        <small th:text="${id==null?'必填，至少 8 字元，最多 72 UTF-8 位元組':'留空保留目前密碼'}">
                        </small>
                    </label>
                    <label>角色<select
                            th:field="*{role}"
                            required
                        >
                            <option value="">請選擇</option>
                            <option
                                th:each="r:${roles}"
                                th:value="${r}"
                                th:text="${r.label}"
                            ></option>
                        </select>
                    </label>
                    <label>部門<select
                            th:field="*{departmentId}"
                            required
                        >
                            <option value="">請選擇</option>
                            <option
                                th:each="d:${departments}"
                                th:value="${d.id}"
                                th:text="${d.name + (d.enabled?'':'（已停用）')}"
                                th:disabled="${!d.enabled and d.id != form.departmentId}"
                            ></option>
                        </select>
                    </label>
                    <label>
                        <input
                            type="checkbox"
                            th:field="*{enabled}"
                        >啟用帳號
                    </label>
                    <button>儲存</button>
                </form>
                <a th:href="@{/admin/users}">返回列表</a>
            </main>
            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </body>
</html>
