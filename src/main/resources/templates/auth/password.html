<!DOCTYPE html>
<html
    lang="zh-Hant"
    xmlns:th="http://www.thymeleaf.org"
>
    <head th:replace="~{fragments/header :: head('修改密碼')}"></head>
    <body>
        <th:block th:if="${actor != null}">
            <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
        </th:block>
        <div
            class="workspace"
            th:classappend="${actor==null}?'guest'"
        >
            <th:block th:if="${actor != null}">
                <header th:replace="~{fragments/header :: header}"></header>
            </th:block>
            <main class="page-content">
                <h1>修改本人密碼</h1>
                <form
                    th:action="@{/profile/password}"
                    th:object="${form}"
                    method="post"
                >
                    <div
                        th:if="${#fields.hasAnyErrors()}"
                        role="alert"
                    >
                        <p
                            th:each="error : ${#fields.allErrors()}"
                            th:text="${error}"
                        ></p>
                    </div>
                    <label>舊密碼
                        <input
                            type="password"
                            name="oldPassword"
                            required
                            autocomplete="current-password"
                        >
                    </label>
                    <label>新密碼
                        <input
                            type="password"
                            name="newPassword"
                            required
                            autocomplete="new-password"
                        >
                    </label>
                    <p>至少 8 字元，最多 72 UTF-8 位元組；修改成功後請重新登入。</p>
                    <button>修改密碼</button>
                </form>
                <a th:href="@{/dashboard}">返回首頁</a>
            </main>
            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </body>
</html>
